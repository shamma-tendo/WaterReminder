<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydration Buddy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .controls {
            margin-bottom: 32px;
        }

        .control-label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .interval-btn {
            padding: 10px 16px;
            border: 1.5px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 200ms ease;
            color: #666;
        }

        .interval-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .interval-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e8ebf0;
            text-align: center;
            transition: all 200ms ease;
        }

        .stat-card:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cta-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            animation: fadeIn 300ms ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            animation: popUp 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popUp {
            from {
                transform: translateY(80px) scale(0.6);
                opacity: 0;
            }
            50% {
                transform: translateY(-10px) scale(1);
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .character {
            font-size: 100px;
            margin-bottom: 24px;
            display: inline-block;
            cursor: pointer;
            animation: wiggle 400ms ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(-3deg) scale(1.05);
            }
            75% {
                transform: rotate(3deg) scale(1.05);
            }
        }

        .modal h2 {
            font-size: 26px;
            color: #1a1a1a;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .modal p {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #26d0ce 0%, #1ec8d9 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(38, 208, 206, 0.3);
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(38, 208, 206, 0.4);
        }

        .modal-btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1.5px solid #e0e0e0;
        }

        .modal-btn-secondary:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }

        .hidden {
            display: none;
        }

        .timer-display {
            font-size: 14px;
            color: #999;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e8ebf0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            .stat-value {
                font-size: 28px;
            }

            .modal {
                padding: 32px 24px;
            }

            .character {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💧 Hydration Buddy</h1>
            <p>Stay hydrated while you code</p>
        </div>

        <div class="controls">
            <label class="control-label">Reminder interval</label>
            <div class="button-group" id="intervalButtons">
                <button class="interval-btn active" data-minutes="30">30m</button>
                <button class="interval-btn" data-minutes="20">20m</button>
                <button class="interval-btn" data-minutes="45">45m</button>
                <button class="interval-btn" data-minutes="60">60m</button>
                <button class="interval-btn" data-minutes="15">15m</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Next drink in</div>
                <div class="stat-value" id="timeLeftDisplay">30</div>
                <div style="font-size: 12px; color: #999; margin-top: 4px;">minutes</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Times hydrated</div>
                <div class="stat-value" id="drinkCountDisplay">0</div>
                <div style="font-size: 12px; color: #999; margin-top: 4px;">today</div>
            </div>
        </div>

        <button class="cta-button" id="testButton">
            ↑ Test Reminder (Click here)
        </button>

        <div class="timer-display" id="timerDisplay">
            Timer active - reminder in 30 minutes
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="character">💧</div>
            <h2>Time to hydrate!</h2>
            <p>Your brain works better when you're hydrated. Take a sip of water and keep coding! 🚀</p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" id="drinkBtn">✓ Yes, let me drink</button>
                <button class="modal-btn modal-btn-secondary" id="snoozeBtn">⏱ Snooze 5m</button>
            </div>
        </div>
    </div>

    <script>
        class HydrationBuddy {
            constructor() {
                this.timeLeft = 30;
                this.totalTime = 30;
                this.drinkCount = 0;
                this.snoozeMinutes = 0;
                this.timerInterval = null;
                this.isRunning = false;

                this.setupEventListeners();
                this.startTimer();
            }

            setupEventListeners() {
                // Interval buttons
                document.querySelectorAll('.interval-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.interval-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        const minutes = parseInt(e.target.dataset.minutes);
                        this.setInterval(minutes);
                    });
                });

                // Modal buttons
                document.getElementById('drinkBtn').addEventListener('click', () => this.handleDrank());
                document.getElementById('snoozeBtn').addEventListener('click', () => this.handleSnooze());

                // Test button
                document.getElementById('testButton').addEventListener('click', () => this.showReminder());

                // Close modal on overlay click
                document.getElementById('modal').addEventListener('click', (e) => {
                    if (e.target.id === 'modal') {
                        this.hideReminder();
                    }
                });
            }

            setInterval(minutes) {
                this.totalTime = minutes;
                this.timeLeft = minutes;
                this.snoozeMinutes = 0;
                this.updateDisplay();
            }

            startTimer() {
                if (this.isRunning) return;
                this.isRunning = true;

                this.timerInterval = setInterval(() => {
                    this.timeLeft--;

                    if (this.timeLeft <= 0) {
                        this.showReminder();
                        this.timeLeft = this.totalTime;
                    }

                    this.updateDisplay();
                }, 60000); // 60000ms = 1 minute
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.isRunning = false;
                }
            }

            handleDrank() {
                this.hideReminder();
                this.drinkCount++;
                this.timeLeft = this.totalTime;
                this.snoozeMinutes = 0;
                this.updateDisplay();
            }

            handleSnooze() {
                this.hideReminder();
                this.snoozeMinutes = 5;
                this.timeLeft = 5;
                this.updateDisplay();
            }

            showReminder() {
                const modal = document.getElementById('modal');
                modal.classList.remove('hidden');
                // Play a subtle sound effect (using Web Audio API)
                this.playSound();
            }

            hideReminder() {
                const modal = document.getElementById('modal');
                modal.classList.add('hidden');
            }

            updateDisplay() {
                document.getElementById('timeLeftDisplay').textContent = this.timeLeft;
                document.getElementById('drinkCountDisplay').textContent = this.drinkCount;
                
                if (this.snoozeMinutes > 0) {
                    document.getElementById('timerDisplay').textContent = `⏱ Snoozed - reminder in ${this.timeLeft} minute${this.timeLeft !== 1 ? 's' : ''}`;
                } else {
                    document.getElementById('timerDisplay').textContent = `Timer active - reminder in ${this.timeLeft} minute${this.timeLeft !== 1 ? 's' : ''}`;
                }
            }

            playSound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';

                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                } catch (e) {
                    console.log('Audio not available');
                }
            }
        }

        // Initialize the app
        const hydrationBuddy = new HydrationBuddy();
    </script>
</body>
</html>
